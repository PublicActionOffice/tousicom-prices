name: snapshot
on:
  schedule:
    - cron: '45 2 * * 1-5'   # 11:45 JST 朝
    - cron: '45 6 * * 1-5'   # 15:45 JST 夕
  workflow_dispatch:
    inputs:
      edition:
        description: morning or evening
        default: evening
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fetch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ED="${{ github.event.inputs.edition }}";
          elif [ "${{ github.event.schedule }}" = "45 2 * * 1-5" ]; then ED=morning; else ED=evening; fi
          python fetch_prices.py "$ED"
      - name: commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add history.csv prices.json
          git diff --cached --quiet || (git commit -m "price snapshot" && git push)
